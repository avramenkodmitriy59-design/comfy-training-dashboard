<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Навчання COMFY — дашборд</title>
<link rel="stylesheet" href="static/css/style.css">
</head>
<body>

<div id="login-screen" class="login-screen" hidden>
  <div class="login-card">
    <img class="logo" src="static/assets/logo_green.png" alt="COMFY">
    <h1>Дашборд навчання</h1>
    <p class="subtitle" id="login-subtitle">Увійдіть з логіном і паролем Feed</p>
    <div id="login-error" class="error-text"></div>
    <input type="text" id="login-user" placeholder="Логін Feed" autocomplete="username">
    <input type="password" id="login-password" placeholder="Пароль Feed" autocomplete="current-password">
    <button class="btn btn-primary btn-block" id="login-submit">Увійти</button>
    <button type="button" class="login-alt" id="login-mode">Вхід адміністратора за паролем сайту</button>
  </div>
</div>

<div id="app" class="page" hidden>

  <div class="top-bar">
    <div class="brand">
      <img class="logo" src="static/assets/logo_green.png" alt="COMFY">
      <div>
        <div class="brand-title">Навчання COMFY</div>
        <div class="brand-subtitle">Залученість і успішність навчання по мережі</div>
      </div>
    </div>
    <div class="top-actions">
      <div class="top-tools">
        <button class="btn btn-secondary btn-sm" id="btn-category-analysis">Аналіз категорій</button>
        <button class="btn btn-secondary btn-sm" id="btn-classify">Класифікація посад</button>
        <button class="btn btn-primary btn-sm" id="btn-feed-sync">Оновити з Feed</button>
        <button class="btn btn-secondary btn-sm" id="btn-upload">Завантажити дані вручну</button>
      </div>
      <div class="top-user">
      <button class="btn btn-secondary btn-sm" id="btn-access" hidden>👥 Доступ</button>
      <span class="feed-auto-note" id="feed-auto-note" hidden></span>
      <span class="user-label" id="user-label"></span>
      <button class="btn btn-secondary btn-sm" id="btn-logout">Вийти</button>
      </div>
    </div>
  </div>

  <div class="tabs-row">
  <div class="tabs">
    <button class="tab-btn active" data-tab="overall">Все навчання</button>
    <button class="tab-btn" data-tab="attestation">Атестація</button>
    <button class="tab-btn" data-tab="project">Проєкти</button>
    <button class="tab-btn" data-tab="trainees">Стажери</button>
    <button class="tab-btn" data-tab="reserve">Кадровий резерв</button>
    <button class="tab-btn" data-tab="kpi">KPI</button>
  </div>
  <button class="btn btn-secondary btn-sm" id="btn-snapshot" title="Зберегти поточну вкладку як HTML-файл (знімок з вибраними фільтрами)">⬇️ Завантажити HTML</button>
  </div>

  <div id="position-switch" class="position-switch" hidden></div>

  <div id="content-area">
    <!-- filled dynamically -->
  </div>

</div>

<div id="category-analysis-view" class="director-report-view" hidden></div>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="static/js/vendor/xlsx.full.min.js"></script>
<script src="static/js/vendor/chart.umd.min.js"></script>
<script src="static/js/reserve.js"></script>
<script src="static/js/app.js"></script>
</body>
</html>
